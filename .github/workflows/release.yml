name: Release & Package Addon

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, Package and Release Addon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install

      - name: Build TypeScript
        run: yarn build

      - name: Extract Tag & Version
        id: vars
        run: |
          TAG_NAME=${GITHUB_REF_NAME}
          VERSION=${TAG_NAME#v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Auto-Sync Manifest (Screenshots & Dynamic URLs)
        run: |
          yarn pandhora sync ./

      - name: Validate and Package Addon (.tladdon)
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.TAG_NAME }}/gustavohps10-redmine-${{ steps.vars.outputs.VERSION }}.tladdon"
          echo "Packing with Download URL: $DOWNLOAD_URL"
          yarn pandhora validate ./
          yarn pandhora pkg ./ --download-url "$DOWNLOAD_URL"
          yarn pandhora sync ./

      - name: Commit and Push Updated Manifest to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Salva manifest.yaml atualizado
          cp manifest.yaml manifest.tmp.yaml
          
          # Limpa alterações locais geradas no build
          git reset --hard HEAD
          
          # Muda para a branch main e sincroniza
          git checkout -B main origin/main
          git pull origin main --rebase || true
          
          # Restaura o manifest atualizado
          mv manifest.tmp.yaml manifest.yaml
          git add manifest.yaml
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): auto-update manifest for ${{ steps.vars.outputs.TAG_NAME }} [skip ci]"
            git push origin main
          else
            echo "Nenhuma alteração no manifest.yaml para commitar."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.vars.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            *.tladdon
            manifest.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Pandhora Addons Registry (Cloudflare Worker)
        run: |
          node -e '
          async function publish() {
            const payload = {
              addonId: "gustavohps10-redmine",
              manifestUrl: "https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.yaml"
            };
            console.log("📡 Notificando catálogo oficial da Pandhora:", payload);
            const res = await fetch("https://addons-manifest.pandhora.workers.dev/", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            const text = await res.text();
            try {
              const data = JSON.parse(text);
              console.log("📦 Resposta do Registry:", data);
              if (!res.ok || data.error) {
                throw new Error(data.error || "Falha na publicação");
              }
            } catch (err) {
              if (!res.ok) throw new Error(text);
              console.log("📦 Resposta:", text);
            }
          }
          publish().catch(err => {
            console.error("❌ Erro ao publicar:", err.message);
            process.exit(1);
          });
          '
