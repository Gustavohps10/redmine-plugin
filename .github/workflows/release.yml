name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install

      - name: Typecheck
        run: yarn tsc --noEmit

      - name: Run Unit Tests
        run: yarn test

      - name: Build TypeScript
        run: yarn build

  release:
    name: Release & Version
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install

      - name: Changesets Action (Create PR or Version Packages)
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn changeset version
          title: 'chore: release packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Release Needed
        id: check_release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "has_release=false" >> $GITHUB_OUTPUT
            echo "Release $TAG_NAME already exists."
          else
            echo "has_release=true" >> $GITHUB_OUTPUT
            echo "Release $TAG_NAME does not exist, creating..."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Addon (.tladdon) and Sync Manifest
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.check_release.outputs.has_release == 'true'
        run: |
          TAG_NAME="${{ steps.check_release.outputs.TAG_NAME }}"
          VERSION="${{ steps.check_release.outputs.VERSION }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/gustavohps10-redmine-${VERSION}.tladdon"
          
          yarn build
          yarn sync:manifest
          yarn pkg --download-url "$DOWNLOAD_URL"
          yarn sync:manifest

      - name: Commit and Push Updated Manifest to main
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.check_release.outputs.has_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          cp manifest.yaml manifest.tmp.yaml
          git reset --hard HEAD
          git checkout -B main origin/main
          git pull origin main --rebase || true
          mv manifest.tmp.yaml manifest.yaml
          git add manifest.yaml
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): auto-update manifest for ${{ steps.check_release.outputs.TAG_NAME }} [skip ci]"
            git push origin main
          fi

      - name: Create GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.check_release.outputs.has_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_release.outputs.TAG_NAME }}
          name: Release ${{ steps.check_release.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            *.tladdon
            manifest.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Mr. Tick Addons Registry (Cloudflare Worker)
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.check_release.outputs.has_release == 'true'
        run: |
          node -e '
          async function publish() {
            const payload = {
              addonId: "gustavohps10-redmine",
              manifestUrl: "https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.yaml"
            };
            console.log("📡 Notificando catálogo oficial do Mr. Tick:", payload);
            const res = await fetch("https://addons-manifest.mistertick.workers.dev/", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            const text = await res.text();
            try {
              const data = JSON.parse(text);
              console.log("📦 Resposta do Registry:", data);
              if (!res.ok || data.error) {
                throw new Error(data.error || "Falha na publicação");
              }
            } catch (err) {
              if (!res.ok) throw new Error(text);
              console.log("📦 Resposta:", text);
            }
          }
          publish().catch(err => {
            console.error("❌ Erro ao publicar:", err.message);
            process.exit(1);
          });
          '
